# prettier-ignore
name: 'meshi'
docPath: docs/db
# Fixed names keep the disposable database name out of generated headings.
# schema.json includes architecture-specific database_version values.
disableOutputSchema: true
er:
  format: mermaid
exclude: ['drizzle.*']
lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
    exclude: [id, created_at, updated_at]
comments:
  - table: nutrient_definitions
    tableComment: 'Catalog of nutrient codes, names, units, and display ordering.'
    columnComments:
      code: 'Identifier for the nutrient.'
      display_name: 'Human-readable nutrient name.'
      unit: 'Unit used for values of this nutrient.'
      is_major: 'Whether this nutrient belongs to the major nutrient group.'
      sort_order: 'Display order within the major or minor nutrient group.'
  - table: food_masters
    tableComment: 'Foods available for meal logging.'
    columnComments:
      name: 'Food name.'
  - table: food_master_aliases
    tableComment: 'Alternate names used to find food master entries.'
    columnComments:
      food_master_id: 'Identifier of the food master this alias belongs to.'
      alias: 'Alternate name used for matching a food master.'
  - table: food_master_nutrients
    tableComment: 'Nutrient values associated with registered foods.'
    columnComments:
      food_master_id: 'Identifier of the food master this nutrient value belongs to.'
      nutrient_code: 'Identifier of the nutrient.'
      value: 'Nutrient value for the food master; its quantity basis is not stored.'
  - table: food_master_nutrition
    tableComment: 'Nutrition source and estimation metadata for a food master.'
    columnComments:
      food_master_id: 'Identifier of the food master this nutrition metadata belongs to.'
      is_estimated: 'Whether the nutrition values are estimated.'
      source: 'Origin of the nutrition values: web search, food composition table, or user input.'
      source_url: 'URL of the web page used as evidence for the nutrition values.'
      source_composition_code: 'Code of the food composition entry used as evidence.'
  - table: meal_logs
    tableComment: 'Recorded food consumption entries.'
    columnComments:
      food_master_id: 'Identifier of the food recorded in this meal log.'
      eaten_date: 'Asia/Tokyo calendar date on which the food was eaten.'
      meal_type: 'Meal category: breakfast, lunch, dinner, or snack.'
      quantity: "Multiplier applied to the food master's nutrient values."
  - table: meal_skips
    tableComment: 'Meals marked as skipped for a date and meal type.'
    columnComments:
      id: 'Opaque identifier exposed in API responses.'
      date: 'Asia/Tokyo calendar date for the skipped meal.'
      meal_type: 'Meal category marked as skipped.'
  - table: food_compositions
    tableComment: 'MEXT food composition reference entries.'
    columnComments:
      code: 'MEXT food composition entry code.'
      name: 'Name of the MEXT food composition entry.'
  - table: food_composition_nutrients
    tableComment: 'Nutrient values for MEXT food composition entries.'
    columnComments:
      food_composition_code: 'Code of the food composition entry this nutrient value belongs to.'
      nutrient_code: 'Identifier of the nutrient.'
      value: 'Nutrient value per 100 g of the food composition entry.'
  - table: user_profiles
    tableComment: 'The singleton user profile for preferences and daily nutrition targets.'
    columnComments:
      likes: 'Items the user likes.'
      dislikes: 'Items the user dislikes.'
      allergies: 'User allergy entries.'
      constraints: 'User dietary constraint entries.'
      daily_targets: 'Daily nutrition target values keyed by nutrient code.'
