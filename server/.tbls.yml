# prettier-ignore
name: 'meshi'
docPath: docs/db
# Fixed names keep the disposable database name out of generated headings.
# schema.json includes architecture-specific database_version values.
disableOutputSchema: true
er:
  format: mermaid
exclude: ['drizzle.*']
lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
    exclude: [id, created_at, updated_at]
comments:
  - table: nutrient_definitions
    tableComment: 'Catalog of nutrient codes, names, units, and display ordering.'
    columnComments:
      code: 'Identifier for the nutrient.'
      display_name: 'Human-readable nutrient name.'
      unit: 'Unit used for values of this nutrient.'
      is_major: 'Whether this nutrient belongs to the major nutrient group.'
      sort_order: 'Display order within the major or minor nutrient group.'
  - table: food_masters
    tableComment: 'Foods available for meal logging.'
    columnComments:
      name: 'Food name.'
  - table: meal_sets
    tableComment: 'Named groups of foods saved for repeated meal logging.'
    columnComments:
      name: 'Name of the meal set.'
  - table: meal_set_items
    tableComment: 'Foods and quantities included in a meal set.'
    columnComments:
      meal_set_id: 'Identifier of the meal set containing this food.'
      food_master_id: 'Identifier of a food included in the meal set.'
      quantity: "Multiplier applied to the food master's nutrient values."
  - table: food_master_aliases
    tableComment: 'Alternate names used to find food master entries.'
    columnComments:
      food_master_id: 'Identifier of the food master this alias belongs to.'
      alias: 'Alternate name used for matching a food master.'
  - table: food_master_nutrients
    tableComment: 'Nutrient values associated with nutrition versions.'
    columnComments:
      nutrition_version_id: 'Identifier of the nutrition version this nutrient value belongs to.'
      nutrient_code: 'Identifier of the nutrient.'
      value: 'Nutrient value for the nutrition version.'
  - table: food_master_nutrition
    tableComment: 'Versioned nutrition metadata for registered foods.'
    columnComments:
      id: 'Identifier of the nutrition version.'
      food_master_id: 'Identifier of the food master this nutrition metadata belongs to.'
      version_no: 'Sequential version number within the food master.'
      is_current: 'Whether this is the current nutrition version.'
      change_kind: 'Kind of change that created this nutrition version.'
      corrects_version_id: 'Identifier of the nutrition version corrected by this version, when applicable.'
      is_estimated: 'Whether the nutrition values are estimated.'
      source: 'Origin of the nutrition values: web search, food composition table, user input, or a model estimate.'
      source_url: 'URL of the web page used as evidence for the nutrition values.'
      source_composition_code: 'Code of the food composition entry used as evidence.'
      serving_basis: 'Description of what one food unit represents.'
      net_content: 'Net content represented by one food unit.'
      checked_on: 'Date the nutrition information was checked.'
      effective_from: 'Date the nutrition information became applicable.'
      reason: 'Reason for this nutrition change.'
      legacy_evidence: 'Whether the source evidence predates current evidence requirements.'
  - table: meal_logs
    tableComment: 'Recorded food consumption entries.'
    columnComments:
      food_master_id: 'Identifier of the food recorded in this meal log.'
      nutrition_version_id: 'Identifier of the nutrition version assigned to this meal log, when known.'
      nutrition_version_origin: 'How the nutrition version was assigned to this meal log.'
      eaten_date: 'Asia/Tokyo calendar date on which the food was eaten.'
      meal_type: 'Meal category: breakfast, lunch, dinner, or snack.'
      quantity: "Multiplier applied to the food master's nutrient values."
  - table: meal_log_nutrition_changes
    tableComment: 'Nutrition version replacements recorded for meal logs.'
    columnComments:
      meal_log_id: 'Identifier of the meal log whose nutrition version changed.'
      from_version_id: 'Identifier of the previous nutrition version, when known.'
      to_version_id: 'Identifier of the replacement nutrition version.'
      reason: 'Reason for replacing the nutrition version.'
  - table: meal_skips
    tableComment: 'Meals marked as skipped for a date and meal type.'
    columnComments:
      id: 'Opaque identifier exposed in API responses.'
      date: 'Asia/Tokyo calendar date for the skipped meal.'
      meal_type: 'Meal category marked as skipped.'
  - table: meal_photos
    tableComment: 'Photos attached to a meal on a specific date.'
    columnComments:
      eaten_date: 'Asia/Tokyo calendar date of the meal.'
      meal_type: 'Meal category the photos belong to.'
      object_key: 'Unique key of the photo object in R2.'
      content_type: 'Image media type: JPEG, PNG, or WebP.'
  - table: food_compositions
    tableComment: 'MEXT food composition reference entries.'
    columnComments:
      code: 'MEXT food composition entry code.'
      name: 'Name of the MEXT food composition entry.'
  - table: food_composition_nutrients
    tableComment: 'Nutrient values for MEXT food composition entries.'
    columnComments:
      food_composition_code: 'Code of the food composition entry this nutrient value belongs to.'
      nutrient_code: 'Identifier of the nutrient.'
      value: 'Nutrient value per 100 g of the food composition entry.'
  - table: user_profiles
    tableComment: 'The singleton user profile for preferences and daily nutrition targets.'
    columnComments:
      likes: 'Items the user likes.'
      dislikes: 'Items the user dislikes.'
      allergies: 'User allergy entries.'
      constraints: 'User dietary constraint entries.'
      daily_targets: 'Daily nutrition target values keyed by nutrient code.'
  - table: storage_locations
    tableComment: 'Named places where stock items are stored.'
    columnComments:
      name: 'Unique name of the storage location.'
      capacity: 'Optional maximum stock capacity in food units.'
  - table: stock_items
    tableComment: 'Foods configured for stock tracking.'
    columnComments:
      food_master_id: 'Identifier of the food tracked in stock.'
      storage_location_id: 'Identifier of the optional storage location.'
      eat_within_days: 'Target number of days from receipt to consume the food.'
  - table: stock_lots
    tableComment: 'Planned delivery, received, or counted batches of stock for a food.'
    columnComments:
      food_master_id: 'Identifier of the food this batch belongs to.'
      delivery_id: 'Identifier of the delivery this batch belongs to, when scheduled.'
      quantity: 'Quantity originally recorded for this batch in food units.'
      received_date: 'Date the batch was received, when known.'
      best_before: 'Best-before date shown for the batch, when known.'
      eat_by: 'Target date to consume the batch, when known.'
  - table: deliveries
    tableComment: 'Expected deliveries and receipt status for stock inventory.'
    columnComments:
      source_ref: 'External identifier used to deduplicate delivery updates.'
      status: 'Lifecycle state of the delivery.'
      expected_date: 'Date the delivery is expected to arrive.'
      received_date: 'Date the delivery was received.'
      change_deadline: 'Deadline for changing or cancelling the delivery, when known.'
  - table: stock_movements
    tableComment: 'Quantity changes recorded against stock lots.'
    columnComments:
      stock_lot_id: 'Identifier of the stock batch affected by this movement.'
      delta: 'Signed quantity change in food units.'
      reason: 'Reason for the quantity change: receive, meal, or count.'
      note: 'Optional note explaining the quantity change.'
      meal_log_id: 'Identifier of the meal log that caused this movement.'
